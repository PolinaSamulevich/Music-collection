<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music</title>
    <link rel="stylesheet" href="/css/player.css?v=1">
</head>
<body>
    <div class="bg-glow"></div>

    <div class="app">
        <header class="topbar">
            <a class="logo" href="/">
                <span class="logo-icon">♪</span>
                <span class="logo-text">Music</span>
            </a>

            <label class="search">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input id="search" type="search" placeholder="Поиск по названию или артисту" autocomplete="off">
            </label>

            <nav class="nav">
                <a href="/admin.html">Админка</a>
                <a href="/swagger">Swagger</a>
            </nav>
        </header>

        <main class="main">
            <section class="intro">
                <h1>Все треки</h1>
                <p id="summary">Загрузка…</p>
            </section>

            <div id="genres" class="chips" aria-label="Жанры"></div>

            <div class="list-head" aria-hidden="true">
                <span class="c-num">#</span>
                <span class="c-title">Название</span>
                <span class="c-genre">Жанр</span>
                <span class="c-time">Время</span>
            </div>
            <div id="track-list" class="track-list"></div>
        </main>
    </div>

    <footer class="player" id="player">
        <div class="now">
            <div class="now-cover" id="now-cover">♪</div>
            <div class="now-text">
                <div class="now-title" id="now-title">Ничего не играет</div>
                <div class="now-artist" id="now-artist">Выбери трек из списка</div>
            </div>
        </div>

        <div class="controls">
            <div class="buttons">
                <button class="ctl" id="btn-prev" type="button" title="Предыдущий" aria-label="Предыдущий">
                    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
                </button>
                <button class="ctl ctl-main" id="btn-play" type="button" title="Играть / пауза (пробел)" aria-label="Играть">
                    <svg class="i-play" viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
                    <svg class="i-pause" viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
                </button>
                <button class="ctl" id="btn-next" type="button" title="Следующий" aria-label="Следующий">
                    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6 18l8.5-6L6 6zM16 6v12h2V6z"/></svg>
                </button>
            </div>
            <div class="progress">
                <span class="time" id="time-now">0:00</span>
                <input id="seek" class="range" type="range" min="0" max="1000" value="0" step="1" aria-label="Перемотка">
                <span class="time" id="time-total">0:00</span>
            </div>
        </div>

        <div class="volume">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            <input id="volume" class="range" type="range" min="0" max="100" value="80" aria-label="Громкость">
        </div>
    </footer>

    <script src="/js/player.js?v=1"></script>
</body>
</html>
